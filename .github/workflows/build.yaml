name: Build

on:
  pull_request:
    branches: ['main']

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [1.19, '1.20']

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - run: |
          go build ./...
          go test -run=^$ ./...
